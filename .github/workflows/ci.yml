name: Agent Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness:
    name: Validate agent harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate repository harness
        run: python scripts/validate-agent-harness.py --skip-beads

      - name: Check documentation whitespace
        run: git diff --check

      - name: Validate observability contract
        run: npm run observability:validate

      - name: Exercise Beads dependency DAG
        run: python scripts/smoke-beads-dag.py
